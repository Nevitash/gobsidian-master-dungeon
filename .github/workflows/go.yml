# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ] # Keep the master branch trigger
    tags:
      - 'v*' # <-- ADD THIS: Triggers on any tag starting with 'v', like v1.0.0 or v2.3
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Test
      run: go test -v ./...

    - name: Build Executable
      run: go build -o gobsidian-dungeon ./cmd/myapp

    - name: Upload Tagged Artifact
      uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/') # <-- Optional: Only run this step if it was triggered by a tag
      with:
        name: gobsidian-dungeon-${{ github.ref_name }} 
        path: gobsidian-dungeon

      
