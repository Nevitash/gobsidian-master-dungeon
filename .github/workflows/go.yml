name: Release Builds - gobsidian-dungeon

on:
  push:
    tags:
      - 'v*' # Trigger only on tag pushes (e.g., v1.0.0)

jobs:
  build:
    # Define the matrix for OS and Architecture
    strategy:
      matrix:
        # Define the runner (OS) to use
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Define the Go OS (GOOS) and architecture (GOARCH) targets
        include:
          - os: ubuntu-latest
            GOOS: linux
            GOARCH: amd64
            # UPDATED: Executable name
            executable: gobsidian-dungeon
          - os: windows-latest
            GOOS: windows
            GOARCH: amd64
            # UPDATED: Executable name with .exe extension
            executable: gobsidian-dungeon.exe
          - os: macos-latest
            GOOS: darwin
            GOARCH: amd64
            # UPDATED: Executable name
            executable: gobsidian-dungeon

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25' # Or your desired Go version

    # ----------------------------------------
    # 1. Build the Executable for the Target OS
    # ----------------------------------------
    - name: Build Executable
      env:
        # Set environment variables for cross-compilation
        GOOS: ${{ matrix.GOOS }}
        GOARCH: ${{ matrix.GOARCH }}
      run: |
        # UPDATED: Use the new executable name in the build command
        go build -o ${{ matrix.executable }} .

    # ----------------------------------------
    # 2. Upload the OS-Specific Artifact
    # ----------------------------------------
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        # UPDATED: Use the new executable name in the artifact name
        name: gobsidian-dungeon-${{ github.ref_name }}-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
        path: ${{ matrix.executable }}