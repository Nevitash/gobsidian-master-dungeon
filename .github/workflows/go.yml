# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*' # Triggers on any tag starting with 'v', like v1.0.0 or v2.3
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Test
      run: go test -v ./...

    - name: Build Executable
      # CHANGED: Use '.' to build the package in the current directory (the root)
      run: go build -o gobsidian-dungeon . 

    - name: Upload Tagged Artifact
      uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: gobsidian-dungeon-${{ github.ref_name }}
        path: gobsidian-dungeon